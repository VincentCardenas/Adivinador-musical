name: 🚩 Reportar una canción
description: Avisa si una pista del juego está mal (es de otro juego, serie, película o musical, es otra canción, es un cover, no suena…).
title: "[Reporte] "
labels: ["reporte-cancion"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudar a mejorar el **Adivinador musical**! Si abriste esto desde el juego, los datos de la pista ya vienen rellenados.
  - type: input
    id: tema
    attributes:
      label: Tema
      description: Videojuegos, Series, Caricaturas, Anime, Disney, Musicales o Canciones (lo rellena el juego).
  - type: input
    id: pista
    attributes:
      label: ID de la pista
      description: Identificador interno de la pista (lo rellena el juego).
    validations:
      required: true
  - type: input
    id: mostrado
    attributes:
      label: Lo que el juego dijo que era
      description: Respuesta y canción que mostró la revelación.
  - type: input
    id: problema
    attributes:
      label: ¿Qué pasó?
      description: Es de otro juego/serie/película/musical, es otra canción, es un cover/remix, no sonó…
    validations:
      required: true
  - type: input
    id: juego_real
    attributes:
      label: ¿De dónde era en realidad?
      description: El juego, la serie, la caricatura, la película, el musical o la canción correcta.
  - type: input
    id: cancion_real
    attributes:
      label: ¿Qué canción (o artista) era en realidad?
  - type: input
    id: fuente
    attributes:
      label: Fuente que sonó
      description: Enlace de Apple Music o YouTube de lo que se reprodujo.
  - type: textarea
    id: comentario
    attributes:
      label: Comentarios
